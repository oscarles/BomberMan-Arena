name: CI

on:
  push:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format (Prettier)
        run: npm run format:check
      - name: Tests
        run: npm run coverage
